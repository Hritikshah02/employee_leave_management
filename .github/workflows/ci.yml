name: Leave Balance Check
on:
  push:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python b/leave_balance.py

# ---------------- STEPS (b) ----------------
# 1. Place this file at .github/workflows/ci.yml (repo root)
# 2. Push any change to main -> workflow runs automatically
# 3. GitHub > Actions tab > open run > check "Run python b/leave_balance.py" step
